name: Daily AI Knowledge Collection

# 每天 UTC 08:00（北京时间 16:00）自动采集
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      CODEX_MODEL: ${{ vars.CODEX_MODEL || 'gpt-5.5' }}
      GITHUB_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Run collection pipeline
        run: |
          python -m MyGK_DB.pipeline.pipeline \
            --sources github,rss \
            --limit 20 \
            --model "${CODEX_MODEL}" \
            --verbose

      - name: Validate collected articles
        run: |
          if ls knowledge/articles/*.json 1>/dev/null 2>&1; then
            python .codex/hooks/validate_json.py knowledge/articles
            python .codex/hooks/check_quality.py knowledge/articles
          else
            echo "No articles to validate"
          fi

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add knowledge/
          if git diff --staged --quiet; then
            echo "No new articles to commit"
          else
            ARTICLE_COUNT=$(git diff --staged --name-only | grep -c '\.json$' || true)
            git commit -m "chore: daily collection - ${ARTICLE_COUNT} articles [$(date -u +%Y-%m-%d)]"
            git push
          fi
