name: Daily AI Knowledge Collection

# 每天 UTC 08:00（北京时间 16:00）自动采集
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      CODEX_MODEL_PROVIDER: ${{ vars.CODEX_MODEL_PROVIDER || 'dogapi' }}
      CODEX_MODEL: ${{ vars.CODEX_MODEL || 'gpt-5.4' }}
      CODEX_MODEL_REASONING_EFFORT: ${{ vars.CODEX_MODEL_REASONING_EFFORT || 'medium' }}
      CODEX_BASE_URL: ${{ vars.CODEX_BASE_URL || 'https://www.dogapi.cc/v1' }}
      GITHUB_TOKEN: ${{ github.token }}
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Configure Codex provider
        env:
          OPENAI_API_KEY: ${{ secrets.CODEX_API_KEY }}
        run: |
          mkdir -p "$HOME/.codex"
          cat > "$HOME/.codex/config.toml" <<EOF
          model_provider = "${CODEX_MODEL_PROVIDER}"
          model = "${CODEX_MODEL}"
          model_reasoning_effort = "${CODEX_MODEL_REASONING_EFFORT}"

          [model_providers.${CODEX_MODEL_PROVIDER}]
          name = "${CODEX_MODEL_PROVIDER}"
          base_url = "${CODEX_BASE_URL}"
          wire_api = "responses"
          requires_openai_auth = true
          supports_websockets = false
          EOF

      - name: Configure Codex hooks
        run: |
          cat > "$HOME/.codex/hooks.json" <<'EOF'
          {
            "hooks": {
              "PostToolUse": [
                {
                  "matcher": "Bash|shell_command",
                  "hooks": [
                    {
                      "type": "command",
                      "command": "python .codex/hooks/validate_json.py knowledge/articles",
                      "timeout": 30,
                      "statusMessage": "Validating knowledge article JSON"
                    },
                    {
                      "type": "command",
                      "command": "python .codex/hooks/check_quality.py knowledge/articles",
                      "timeout": 30,
                      "statusMessage": "Checking knowledge article quality"
                    }
                  ]
                }
              ]
            }
          }
          EOF

      - name: Run collection pipeline
        run: |
          python -m MyGK_DB.pipeline.pipeline \
            --sources github,rss \
            --limit 20 \
            --model "${CODEX_MODEL}" \
            --verbose

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add knowledge/
          if git diff --staged --quiet; then
            echo "No new articles to commit"
          else
            ARTICLE_COUNT=$(git diff --staged --name-only | grep -c '\.json$' || true)
            git commit -m "chore: daily collection - ${ARTICLE_COUNT} articles [$(date -u +%Y-%m-%d)]"
            git push
          fi
