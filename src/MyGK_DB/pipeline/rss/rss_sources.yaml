# RSS 数据源配置
# 用于 pipeline.py 自动采集 AI 技术内容

sources:
  # --- 综合技术 ---
  - id: "rss:hacker-news-best"
    type: "rss"
    name: "Hacker News (Best)"
    url: "https://hnrss.org/best?q=AI+OR+LLM+OR+agent"
    category: "general"
    enabled: true
    trust_tier: "medium"
    limit: 10
    keywords: ["AI", "LLM", "agent", "RAG", "MCP"]
    quality_weight: 1.0
    parser: "rss"
    fetch_timeout_seconds: 20

  - id: "rss:reddit-machinelearning"
    type: "rss"
    name: "Reddit r/MachineLearning"
    url: "https://www.reddit.com/r/MachineLearning/hot.rss"
    category: "research"
    enabled: true
    trust_tier: "medium"
    limit: 10
    keywords: ["machine-learning", "AI", "LLM"]
    quality_weight: 0.9
    parser: "rss"
    fetch_timeout_seconds: 20

  - id: "rss:reddit-localllama"
    type: "rss"
    name: "Reddit r/LocalLLaMA"
    url: "https://www.reddit.com/r/LocalLLaMA/hot.rss"
    category: "open-source"
    enabled: true
    trust_tier: "medium"
    limit: 10
    keywords: ["LLM", "local-llm", "inference"]
    quality_weight: 0.9
    parser: "rss"
    fetch_timeout_seconds: 20

  # --- AI 研究 ---
  - id: "rss:arxiv-cs-ai"
    type: "rss"
    name: "arXiv cs.AI"
    url: "https://rss.arxiv.org/rss/cs.AI"
    category: "research"
    enabled: true
    trust_tier: "high"
    limit: 10
    keywords: ["AI", "agent", "reasoning"]
    quality_weight: 1.1
    parser: "rss"
    fetch_timeout_seconds: 20

  - id: "rss:arxiv-cs-cl"
    type: "rss"
    name: "arXiv cs.CL"
    url: "https://rss.arxiv.org/rss/cs.CL"
    category: "research"
    enabled: false  # 量太大，按需开启
    trust_tier: "high"
    limit: 10
    keywords: ["LLM", "NLP", "language-model"]
    quality_weight: 1.1
    parser: "rss"
    fetch_timeout_seconds: 20

  # --- 公司博客 ---
  - id: "rss:openai-blog"
    type: "rss"
    name: "OpenAI Blog"
    url: "https://openai.com/blog/rss.xml"
    category: "industry"
    enabled: true
    trust_tier: "high"
    limit: 10
    keywords: ["OpenAI", "LLM", "agent"]
    quality_weight: 1.2
    parser: "rss"
    fetch_timeout_seconds: 20

  - id: "rss:anthropic-research"
    type: "rss"
    name: "Anthropic Research"
    url: "https://www.anthropic.com/research/rss.xml"
    category: "industry"
    enabled: true
    trust_tier: "high"
    limit: 10
    keywords: ["Anthropic", "Claude", "LLM"]
