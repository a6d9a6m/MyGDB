    fetch_timeout_seconds: 20

  - id: "rss:google-ai-blog"
    type: "rss"
    name: "Google AI Blog"
    url: "https://blog.google/technology/ai/rss/"
    category: "industry"
    enabled: true
    trust_tier: "high"
    limit: 10
    keywords: ["Google", "AI", "Gemini"]
    quality_weight: 1.1
    parser: "rss"
    fetch_timeout_seconds: 20

  # --- 开发者社区 ---
  - id: "rss:huggingface-blog"
    type: "rss"
    name: "Hugging Face Blog"
    url: "https://huggingface.co/blog/feed.xml"
