[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mygk-db"
version = "0.1.0"
description = "Local AI knowledge-base collection, analysis, and publishing tools."
readme = "AGENTS.md"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0",
  "httpx>=0.27",
  "langgraph>=1.0,<2.0",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
checkpoint = [
  "langgraph-checkpoint-sqlite>=3.0.1",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
mygk-pipeline = "MyGK_DB.pipeline.pipeline:main"
mygk-graph-pipeline = "MyGK_DB.pipeline.graph:main"
mygk-mcp-server = "MyGK_DB.mcp_knowledge_server:main"
mygk-migrate-articles = "MyGK_DB.scripts.migrate_articles:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
MyGK_DB = ["pipeline/rss/*.yaml"]

[tool.mygk-db.env]
required = ["CODEX_API_KEY"]
optional = [
  "CODEX_MODEL_PROVIDER",
  "CODEX_MODEL",
  "CODEX_MODEL_REASONING_EFFORT",
  "CODEX_BASE_URL",
  "CODEX_BIN",
  "GITHUB_TOKEN",
]

[tool.mygk-db.codex]
model_provider = "dogapi"
model = "gpt-5.4"
model_reasoning_effort = "medium"

[tool.mygk-db.codex.model_providers.dogapi]
name = "dogapi"
base_url = "https://www.dogapi.cc/v1"
wire_api = "responses"
requires_openai_auth = true
supports_websockets = false

[tool.mygk-db.github-actions]
codex-install = "npm install -g @openai/codex"
daily-collect-workflow = ".github/workflows/daily-collect.yml"
